#  cloud:
#    config:
#      name: ecommerce
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console
#  datasource:
#    driver-class-name: org.h2.Driver
#    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
#    username: sa
#    password:
  jpa:
    hibernate:
      ddl-auto: update
  security:
    user:
      name: user
      password: $2a$10$ihI.uObUGvEsXUVdtBS/FeDkeFmLARmxrJRtlgbrouufb/qkGlrV.
#      password: "{bcrypt}$2a$10$ihI.uObUGvEsXUVdtBS/FeDkeFmLARmxrJRtlgbrouufb/qkGlrV."

logging:
  level:
    org.springframework.security: DEBUG
    com.example.userservice.client: DEBUG
  # 패턴 설정을 안해도 기본 패턴에 traceId/spanId가 출력됨
#  pattern:
#    correlation: '[${spring.application.name:},%X{traceId:-},%X{spanId:-}] '

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true # 호스트명 대신 IP로 등록
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
    fetch-registry: true
    register-with-eureka: true

greeting:
  message: Welcome to the Simple E-commerce.

#token:
#  expiration-time: 86400000 # 1 days
#  secret: my-very-long-secret-key-1234567890123456

management:
  tracing:
    sampling:
      probability: 1.0 # 100% 다 전달
    propagation: # 모든 서비스가 같은 형식을 써야 추적이 끊기지 않음
      consume: B3
      produce: B3
  zipkin:
    tracing:
      # Zipkin 서버에 로그를 전달 및 저장하고자 할 때 쓰일 엔드포인트
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - busrefresh